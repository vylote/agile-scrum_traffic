version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: redis_container
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Ho_Chi_Minh

volumes:
  mongo_data: